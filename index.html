    <title>BIILE EXAMINATION BOARD (BEB)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: ltr;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result-card {
            display: none;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            background-color: #ffffff;
        }
        .student-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #edf2f7;
        }
        .student-info p {
            margin: 5px 0;
            font-size: 15px;
        }
        .student-info strong {
            color: #4a5568;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f7fafc;
            color: #4a5568;
        }
        .status-pass {
            color: #2f855a;
            font-weight: bold;
            background-color: #c6f6d5;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .error-msg {
            color: #e53e3e;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

    <div class="search-box">

    <div id="errorMsg" class="error-msg">ROLL NUMBERKAAS MAJIRO. Fadlan KA HUBI KAARKAAGII IMTIXAANKA.</div>

    <div id="resultCard" class="result-card">
        <div class="student-info">
            <p><strong>Magaca:</strong> <span id="resName"></span></p>
            <p><strong>Roll No:</strong> <span id="resRoll"></span></p>
            <p><strong>Iskuulka:</strong> <span id="resSchool"></span></p>

            <p><strong>Grade:</strong> <span id="resGrade"></span></p>

            </thead>

    function searchStudent() {
        const query = document.getElementById('searchInput').value.trim().toUpperCase();
        const resultCard = document.getElementById('resultCard');
        const errorMsg = document.getElementById('errorMsg');
        
        const student = studentsData.find(s => s.roll === query || s.name.includes(query));

        if (student) {
            errorMsg.style.display = 'none';
            resultCard.style.display = 'block';

            document.getElementById('resName').innerText = student.name;
            document.getElementById('resRoll').innerText = student.roll;
            document.getElementById('resSchool').innerText = student.school;
            document.getElementById('resClass').innerText = student.class;
            document.getElementById('resTotal').innerText = student.total;
            document.getElementById('resAvg').innerText = student.avg;
            document.getElementById('resGrade').innerText = student.grade;
            document.getElementById('resStatus').innerText = student.status;

            const subjects = [
                { name: "Islam", mark: student.islam },
                { name: "Arabi", mark: student.arabi },
                { name: "Physics", mark: student.physics },
                { name: "Maths", mark: student.maths },
                { name: "Somali", mark: student.somali },
                { name: "Biology", mark: student.biology },
                { name: "Chemistry", mark: student.chemistry },
                { name: "ICT", mark: student.ict },
                { name: "English", mark: student.english },
                { name: "Geography", mark: student.geography },
                { name: "History", mark: student.history }
            ];

            const tbody = document.getElementById('marksTableBody');
            tbody.innerHTML = ''; 

            subjects.forEach(sub => {
                const tr = document.createElement('tr');
                const tdName = document.createElement('td');
                const tdMark = document.createElement('td');
                
                tdName.innerText = sub.name;
                tdMark.innerHTML = '<strong>' + sub.mark + '</strong>';
                
                tr.appendChild(tdName);
                tr.appendChild(tdMark);
                tbody.appendChild(tr);
            });

        } else {
            resultCard.style.display = 'none';
            errorMsg.style.display = 'block';
        }
    }
