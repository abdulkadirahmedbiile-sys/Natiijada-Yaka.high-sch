<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIILE EXAMINATION BOARD (BEB)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
        }
        h2 {
            color: #1a365d;
            margin-bottom: 5px;
            font-size: 22px;
        }
        h3 {
            color: #4a5568;
            margin-bottom: 25px;
            font-size: 16px;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 7px;
            color: #4a5568;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #3182ce;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1a365d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 6px;
            display: none;
            text-align: left;
        }
        .error {
            background-color: #fed7d7;
            color: #9b2c2c;
            border-left: 5px solid #e53e3e;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
        }
        .success {
            background-color: #e6fffa;
            color: #234e52;
            border-left: 5px solid #319795;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a365d;
            margin-bottom: 15px;
            border-bottom: 1px solid #cbd5e0;
            padding-bottom: 5px;
        }
        .result-item {
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
        }
        .result-item span {
            font-weight: bold;
            color: #4a5568;
        }
        .total-row {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #cbd5e0;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Haddii magaca sawirkaagu yahay mid kale, halkan ku baddal logo.png -->
    <img src="logo.jpeg" alt="BEB Logo" class="logo">
    
    <h2>BIILE EXAMINATION BOARD</h2>
    <h3>(BEB)</h3>

    <div class="form-group">
        <label for="studentId">Geli Roll No kaaga:</label>
        <input type="text" id="studentId" placeholder="Tusaale: YK260010...">

    <button onclick="checkResult()">Eeg Natiijada</button>

    <div id="result" class="result-box"></div>
</div>

    function checkResult() {
        const idInput = document.getElementById("studentId").value.trim().toUpperCase();
        const resultDiv = document.getElementById("result");
        
        resultDiv.style.display = "none";
        resultDiv.className = "result-box";
        resultDiv.innerHTML = "";

        if (idInput === "") {
            resultDiv.style.display = "block";
            resultDiv.classList.add("error");
            resultDiv.innerHTML = "Fadlan geli Roll No.";
            return;
        }

        const student = studentsData[idInput];

        if (student) {
            if (student.hasDebt) {
                resultDiv.style.display = "block";
                resultDiv.classList.add("error");
                resultDiv.innerHTML = "FADLAN ISKA BIXI LACAGTA KUGU TAAGAN.";
            } else {
                resultDiv.style.display = "block";
                resultDiv.classList.add("success");
                resultDiv.innerHTML = `
                    <div class="result-title">NATIIJADA ARDAYGA</div>
                    <div class="result-item"><span>Magaca:</span> ${student.name}</div>
                                    resultDiv.innerHTML = `
                    <div class="result-title">NATIIJADA ARDAYGA</div>
                    <div class="result-item"><span>Magaca:</span> ${student.name}</div>
                    <div class="result-item"><span>Roll No:</span> ${idInput}</div>
                    <div class="result-item"><span>Bedelka Guud (Total):</span> ${student.total}</div>
                    <div class="result-item"><span>Celcelis (Avg):</span> ${student.avg}%</div>
                    <div class="result-item"><span>Darajo (Grade):</span> ${student.grade}</div>
                    <div class="result-item total-row" style="color: #234e52;"><span>Xaaladda (Status):</span> ${student.status}</div>
                `;
            }
        } else {
            resultDiv.style.display = "block";
            resultDiv.classList.add("error");
            resultDiv.innerHTML = "Ma jiro arday leh Roll No-gaan. Fadlan hubi.";
        }
    }

</html>
